<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog - My Vlog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a class="logo" href="index.html">My Vlog</a>
    <div>
      <a href="index.html">Home</a>
      <a class="active" href="blog.html">Blog</a>
      <a href="about.html">About</a>
    </div>
  </nav>
  <main>
    <h1>The Blog</h1>
    <p class="meta">Write a post and comment on posts below.</p>

    <div class="card">
      <h2>✍️ Write a post</h2>
      <input id="pName" placeholder="Your name (optional)">
      <input id="pTitle" placeholder="Title">
      <textarea id="pBody" rows="4" placeholder="What's on your mind?"></textarea>
      <button id="publish">Publish</button>
    </div>

    <div id="posts"></div>
  </main>
  <footer>© 2026 My Vlog · Final Project</footer>
  <script src="main.js"></script>
</body>
</html>
